name: Deploy to One.com

on:
  push:
    branches: [v5]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: harensfvo-v2/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: harensfvo-v2

      - name: Build
        run: pnpm build
        working-directory: harensfvo-v2

      # TODO: Uncomment and fill in once One.com FTP credentials are added to GitHub secrets.
      # Go to GitHub repo → Settings → Secrets and variables → Actions and add:
      #   FTP_SERVER   — your One.com FTP hostname (e.g. ftp.harensfvo.se)
      #   FTP_USERNAME — your One.com FTP username
      #   FTP_PASSWORD — your One.com FTP password
      # Then set server-dir to your One.com webroot (commonly /public_html/ or /).

